# Production Example Inventory
# Shows correct use of ansible_host for real edge devices

[tulip_edge_devices]
# Production floor devices
factory-floor-01 ansible_host=10.0.1.100
factory-floor-02 ansible_host=10.0.1.101
factory-floor-03 ansible_host=10.0.1.102

# Quality control devices
qc-station-01 ansible_host=10.0.2.50
qc-station-02 ansible_host=10.0.2.51

# Office demo device
office-demo ansible_host=192.168.1.100

# Development/testing (using DNS names)
dev-device ansible_host=dev-edge.company.com

[production_floor]
factory-floor-01
factory-floor-02
factory-floor-03

[quality_control]
qc-station-01
qc-station-02

[development]
office-demo
dev-device

# Common variables for all edge devices
[tulip_edge_devices:vars]
device_password="{{ vault_edge_password }}"
edge_api_port=80
edge_use_https=false
edge_api_timeout=30

# Override for QC devices (they use HTTPS)
[quality_control:vars]
edge_use_https=true
edge_api_port=443

# Override for development (longer timeout)
[development:vars]
edge_api_timeout=60

---
# Tulip Edge Network Configuration Confirmation Playbook
# Confirms network configuration changes to prevent auto-revert

- name: Confirm Network Configuration Changes on Tulip Edge Devices
  hosts: tulip_edge_devices
  gather_facts: false
  strategy: free  # Enable parallel execution
  vars:
    tulip_edge_port: "{{ edge_api_port | default(80) }}"
    tulip_edge_https: "{{ edge_use_https | default(false) }}"
    tulip_edge_timeout: "{{ edge_api_timeout | default(30) }}"

  tasks:
    - name: Check for authentication token
      assert:
        that:
          - tulip_auth_token is defined
          - tulip_auth_token | length > 0
        fail_msg: "Authentication token not found. Please run login playbook first."

    - name: Display confirmation notice
      ansible.builtin.debug:
        msg: |
          🔄 Confirming Network Configuration Changes for {{ inventory_hostname }}
          
          This will commit any pending network configuration changes and
          prevent automatic revert to previous configuration.

    - name: Execute confirm_network_config
      tulip.edge.tulip_edge_api:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ tulip_edge_port }}"
        use_https: "{{ tulip_edge_https }}"
        timeout: "{{ tulip_edge_timeout }}"
        action: confirm_network_config
        token: "{{ tulip_auth_token }}"
        parameters: {}
      register: confirm_result
      delegate_to: localhost

    - name: Display confirmation results
      ansible.builtin.debug:
        msg: |
          Network Configuration Confirmation Results for {{ inventory_hostname }}:
          - Status: {{ 'Success' if confirm_result.result.api_success else 'Failed' }}
          - Configuration committed: {{ confirm_result.result.config_committed | default('Unknown') }}
          - Operation completed: {{ confirm_result.result.operation_completed | default('Unknown') }}
          - Message: {{ confirm_result.result.message | default('No message') }}
      when: confirm_result.result is defined

    - name: Display success message
      ansible.builtin.debug:
        msg: |
          ✅ Network configuration changes confirmed for {{ inventory_hostname }}
          🔒 Configuration is now committed and will not auto-revert
      when: confirm_result.result.api_success | default(false)

    - name: Display failure message
      ansible.builtin.debug:
        msg: |
          ❌ Failed to confirm network configuration for {{ inventory_hostname }}
          Error: {{ confirm_result.result.error_message | default('Unknown error') }}
          
          ⚠️  WARNING: Configuration may auto-revert if not confirmed!
      when: confirm_result.result is defined and not (confirm_result.result.api_success | default(false))

    - name: Show warning on confirmation failure
      ansible.builtin.debug:
        msg: |
          ⚠️  IMPORTANT: Confirmation failed for {{ inventory_hostname }}!
          
          Possible causes:
          - No pending configuration changes to confirm
          - Configuration already auto-reverted
          - Device connectivity issues
          - Invalid authentication token
          
          Check device status and retry if needed.
      when: confirm_result.result is defined and not (confirm_result.result.api_success | default(false))

  handlers:
    - name: Handle confirmation failure
      ansible.builtin.debug:
        msg: "Network configuration confirmation failed for {{ inventory_hostname }}"

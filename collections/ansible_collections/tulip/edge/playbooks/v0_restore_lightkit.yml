---
# Tulip Edge Restore LightKit Playbook
# Restores LightKit configuration from local backup files
# Usage:
#   - Automatic latest: ansible-playbook restore_lightkit.yml
#   - Specific backup: ansible-playbook restore_lightkit.yml -e "lightkit_backup_name=specific-backup"

- name: Restore LightKit on Tulip Edge Devices
  hosts: tulip_edge_devices
  gather_facts: false
  strategy: free  # Enable parallel execution
  vars:
    tulip_edge_port: "{{ edge_api_port | default(80) }}"
    tulip_edge_https: "{{ edge_use_https | default(false) }}"
    tulip_edge_timeout: "{{ edge_api_timeout | default(30) }}"
  
  tasks:
    - name: Check for authentication token
      assert:
        that:
          - tulip_auth_token is defined
          - tulip_auth_token | length > 0
        fail_msg: "Authentication token not found. Please run login playbook first."

    - name: Find backup files for this device
      find:
        paths: "{{ lightkit_backup_dir | default('./backups') }}"
        patterns: "{{ inventory_hostname }}-lightkit-*.json"
      register: backup_files
      delegate_to: localhost

    - name: Determine which backup to use
      set_fact:
        backup_to_restore: "{{ backup_files.files | sort(attribute='mtime') | last }}"
      when: 
        - lightkit_backup_name is not defined
        - backup_files.files | length > 0

    - name: Use specific backup if requested
      set_fact:
        backup_to_restore: "{{ {'path': lightkit_backup_dir | default('./backups') + '/' + (lightkit_backup_name if lightkit_backup_name.endswith('.json') else lightkit_backup_name + '.json')} }}"
      when: lightkit_backup_name is defined

    - name: Check if backup file exists
      stat:
        path: "{{ backup_to_restore.path }}"
      register: backup_file_stat
      delegate_to: localhost

    - name: Fail if no backup found
      fail:
        msg: |
          No backup file found for device {{ inventory_hostname }}
          {% if lightkit_backup_name is defined %}Requested file: {{ backup_to_restore.path }}{% else %}No backups found matching: {{ inventory_hostname }}-lightkit-*.json{% endif %}
          Available files: {{ backup_files.files | map(attribute='path') | list }}
      when: not backup_file_stat.stat.exists

    - name: Read backup file
      slurp:
        src: "{{ backup_to_restore.path }}"
      register: backup_content
      delegate_to: localhost

    - name: Parse backup data
      set_fact:
        backup_data: "{{ backup_content.content | b64decode | from_json }}"

    - name: Display restore details
      debug:
        msg: |
          Device: {{ inventory_hostname }}
          Restoring from: {{ backup_to_restore.path }}
          Original device: {{ backup_data.device }}
          Backup timestamp: {{ backup_data.timestamp }}
          Config size: {{ backup_data.config | to_json | length }} bytes

    - name: Debug what we're sending to module
      debug:
        msg: |
          Config data being sent to module:
          {{ backup_data.config | to_nice_json }}

    - name: Restore configuration to device
      tulip.edge.tulip_edge_api:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ tulip_edge_port }}"
        use_https: "{{ tulip_edge_https }}"
        timeout: "{{ tulip_edge_timeout }}"
        action: restore_lightkit
        token: "{{ tulip_auth_token }}"
        device_name: "{{ inventory_hostname }}"
        parameters:
          config_data: "{{ backup_data.config }}"
      register: operation_result
      delegate_to: localhost
      
    - name: Display operation result
      debug:
        msg: |
          LightKit restore completed successfully
          Device: {{ inventory_hostname }}
          Restored from: {{ backup_to_restore.path }}
          Original device: {{ backup_data.device }}
          Backup timestamp: {{ backup_data.timestamp }}
          Status: {{ operation_result.result.message | default('Success') }}

    - name: Display debug information
      debug:
        var: operation_result.debug_info

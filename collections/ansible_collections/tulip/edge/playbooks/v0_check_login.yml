---
- name: Check login token validity
  hosts: tulip_edge_devices
  gather_facts: false
  vars:
    tulip_username: "{{ tulip_edge_username | default('tulip') }}"
    tulip_password: "{{ tulip_edge_password }}"
    
  tasks:
    - name: Check if token exists
      debug:
        msg: "Checking token for {{ inventory_hostname }}"
      when: tulip_auth_token is defined

    - name: Check if token is still valid
      tulip.edge.tulip_edge_api:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ tulip_edge_port | default(80) }}"
        use_https: "{{ tulip_edge_use_https | default(false) }}"
        action: check_login
        token: "{{ tulip_auth_token }}"
        device_name: "{{ inventory_hostname }}"
      register: check_result
      ignore_errors: true
      when: tulip_auth_token is defined

    - name: Display token validation result
      debug:
        msg: |
          Device: {{ inventory_hostname }}
          Has Token: {{ tulip_auth_token is defined }}
          Token Status: {% if tulip_auth_token is not defined %}NO TOKEN{% elif check_result.failed %}INVALID{% else %}VALID{% endif %}
          {% if tulip_auth_token is defined and check_result.failed %}Error: {{ check_result.msg }}{% endif %}
          {% if tulip_auth_token is defined and not check_result.failed %}Response: {{ check_result.result }}{% endif %}

    - name: Set token status fact
      set_fact:
        token_valid: "{{ tulip_auth_token is defined and not check_result.failed }}"
        
    - name: Token validation summary
      debug:
        msg: "Token for {{ inventory_hostname }} is {% if token_valid %}valid{% else %}invalid and needs renewal{% endif %}"

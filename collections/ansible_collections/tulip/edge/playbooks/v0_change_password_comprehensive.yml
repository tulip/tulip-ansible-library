---
# Tulip Edge Change Password Playbook  
# Changes device password using new comprehensive change_password function

- name: Change Password on Tulip Edge Devices
  hosts: tulip_edge_devices
  gather_facts: false
  strategy: free  # Enable parallel execution
  vars:
    tulip_edge_port: "{{ edge_api_port | default(80) }}"
    tulip_edge_https: "{{ edge_use_https | default(false) }}"
    tulip_edge_timeout: "{{ edge_api_timeout | default(30) }}"
    old_password: "{{ old_device_password | default('') }}"
    new_password: "{{ new_device_password | default('') }}"
    username: "{{ device_username | default('tulip') }}"

  tasks:
    - name: Verify required variables are set
      ansible.builtin.fail:
        msg: "Required variable {{ item }} is not defined"
      when: vars[item] is not defined or vars[item] == ''
      loop:
        - old_password
        - new_password

    - name: Login to device with old password
      tulip.edge.tulip_edge_api:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ tulip_edge_port }}"
        use_https: "{{ tulip_edge_https }}"
        timeout: "{{ tulip_edge_timeout }}"
        action: login
        username: "{{ username }}"
        password: "{{ old_password }}"
        device_name: "{{ inventory_hostname }}"
      register: login_result
      delegate_to: localhost
      no_log: false

    - name: Change device password
      tulip.edge.tulip_edge_api:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ tulip_edge_port }}"
        use_https: "{{ tulip_edge_https }}"
        timeout: "{{ tulip_edge_timeout }}"
        action: change_password
        token: "{{ login_result.token }}"
        device_name: "{{ inventory_hostname }}"
        parameters:
          old_password: "{{ old_password }}"
          new_password: "{{ new_password }}"
          username: "{{ username }}"
      register: change_result
      delegate_to: localhost
      no_log: false

    - name: Display change result
      ansible.builtin.debug:
        msg: "Password changed successfully for {{ inventory_hostname }}"
      when: change_result.changed

    - name: Verify new password by attempting login
      tulip.edge.tulip_edge_api:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ tulip_edge_port }}"
        use_https: "{{ tulip_edge_https }}"
        timeout: "{{ tulip_edge_timeout }}"
        action: login
        username: "{{ username }}"
        password: "{{ new_password }}"
        device_name: "{{ inventory_hostname }}"
      register: verify_result
      delegate_to: localhost
      no_log: false

    - name: Display verification result
      ansible.builtin.debug:
        msg: "New password verified successfully - login with new password works"
      when: verify_result.token is defined

    - name: Display operation result
      debug:
        msg: "Change Password on {{ inventory_hostname }} completed successfully"

  handlers:
    - name: Handle password change failure
      ansible.builtin.debug:
        msg: "Password change failed for {{ inventory_hostname }}"
